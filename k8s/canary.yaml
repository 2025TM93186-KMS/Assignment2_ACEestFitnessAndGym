# Both Deployments carry label app=aceest-canary, so the Service splits traffic by replica ratio (9:1 ~ 10% canary).
apiVersion: apps/v1
kind: Deployment
metadata: { name: aceest-stable, namespace: aceest }
spec:
  replicas: 9
  selector: { matchLabels: { app: aceest-canary, track: stable } }
  template:
    metadata: { labels: { app: aceest-canary, track: stable } }
    spec:
      containers:
      - name: app
        image: devkg1/aceest-fitness:V1
        env:
        - name: FLASK_HOST
          value: "0.0.0.0"
        ports: [{ containerPort: 5000 }]
        readinessProbe: { tcpSocket: { port: 5000 }, initialDelaySeconds: 5 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: aceest-canary, namespace: aceest }
spec:
  replicas: 1
  selector: { matchLabels: { app: aceest-canary, track: canary } }
  template:
    metadata: { labels: { app: aceest-canary, track: canary } }
    spec:
      containers:
      - name: app
        image: devkg1/aceest-fitness:V1
        env:
        - name: FLASK_HOST
          value: "0.0.0.0"
        ports: [{ containerPort: 5000 }]
        readinessProbe: { tcpSocket: { port: 5000 }, initialDelaySeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: aceest-canary, namespace: aceest }
spec:
  type: NodePort
  selector: { app: aceest-canary }
  ports: [{ port: 80, targetPort: 5000, nodePort: 30082 }]
