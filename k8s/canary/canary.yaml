# Service selects only the shared label, so traffic splits by replica ratio: 3 stable : 1 canary ~ 25% canary.
apiVersion: apps/v1
kind: Deployment
metadata: { name: aceest-stable }
spec:
  replicas: 3
  selector: { matchLabels: { app: aceest-canary-demo, track: stable } }
  template:
    metadata: { labels: { app: aceest-canary-demo, track: stable } }
    spec:
      containers:
      - name: aceest
        image: YOUR_DOCKERHUB_USER/aceest-fitness:1.0
        ports: [{ containerPort: 5000 }]
        readinessProbe: { httpGet: { path: /api/health, port: 5000 }, periodSeconds: 5 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: aceest-canary }
spec:
  replicas: 1
  selector: { matchLabels: { app: aceest-canary-demo, track: canary } }
  template:
    metadata: { labels: { app: aceest-canary-demo, track: canary } }
    spec:
      containers:
      - name: aceest
        image: YOUR_DOCKERHUB_USER/aceest-fitness:1.1
        ports: [{ containerPort: 5000 }]
        readinessProbe: { httpGet: { path: /api/health, port: 5000 }, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: aceest-canary-svc }
spec:
  type: NodePort
  selector: { app: aceest-canary-demo }
  ports: [{ port: 80, targetPort: 5000, nodePort: 30082 }]
