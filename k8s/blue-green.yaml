apiVersion: apps/v1
kind: Deployment
metadata: { name: aceest-blue, namespace: aceest }
spec:
  replicas: 2
  selector: { matchLabels: { app: aceest-bg, slot: blue } }
  template:
    metadata: { labels: { app: aceest-bg, slot: blue } }
    spec:
      containers:
      - name: app
        image: devkg1/aceest-fitness:V3
        env:
        - name: FLASK_HOST
          value: "0.0.0.0"
        ports: [{ containerPort: 5000 }]
        readinessProbe: { tcpSocket: { port: 5000 }, initialDelaySeconds: 5 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: aceest-green, namespace: aceest }
spec:
  replicas: 2
  selector: { matchLabels: { app: aceest-bg, slot: green } }
  template:
    metadata: { labels: { app: aceest-bg, slot: green } }
    spec:
      containers:
      - name: app
        image: devkg1/aceest-fitness:V3
        env:
        - name: FLASK_HOST
          value: "0.0.0.0"
        ports: [{ containerPort: 5000 }]
        readinessProbe: { tcpSocket: { port: 5000 }, initialDelaySeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: aceest-bg, namespace: aceest }
spec:
  type: NodePort
  selector: { app: aceest-bg, slot: blue }
  ports: [{ port: 80, targetPort: 5000, nodePort: 30081 }]
