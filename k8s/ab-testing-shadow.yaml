# Needs: minikube addons enable ingress   (ingress-nginx)

apiVersion: apps/v1
kind: Deployment
metadata: { name: aceest-a, namespace: aceest }
spec:
  replicas: 2
  selector: { matchLabels: { app: aceest-ab, variant: a } }
  template:
    metadata: { labels: { app: aceest-ab, variant: a } }
    spec:
      containers:
      - name: app
        image: devkg1/aceest-fitness:V1
        env:
        - name: FLASK_HOST
          value: "0.0.0.0"
        ports: [{ containerPort: 5000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: aceest-b, namespace: aceest }
spec:
  replicas: 2
  selector: { matchLabels: { app: aceest-ab, variant: b } }
  template:
    metadata: { labels: { app: aceest-ab, variant: b } }
    spec:
      containers:
      - name: app
        image: devkg1/aceest-fitness:V1
        env:
        - name: FLASK_HOST
          value: "0.0.0.0"
        ports: [{ containerPort: 5000 }]
---
apiVersion: v1
kind: Service
metadata: { name: aceest-a, namespace: aceest }
spec: { selector: { app: aceest-ab, variant: a }, ports: [{ port: 80, targetPort: 5000 }] }
---
apiVersion: v1
kind: Service
metadata: { name: aceest-b, namespace: aceest }
spec: { selector: { app: aceest-ab, variant: b }, ports: [{ port: 80, targetPort: 5000 }] }
---
# A/B testing: default -> A; requests with header "X-Variant: B" -> B
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: aceest-ab-main, namespace: aceest }
spec:
  ingressClassName: nginx
  rules:
  - host: ab.aceest.local
    http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: aceest-a, port: { number: 80 } } } }] }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-ab-variant-b
  namespace: aceest
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-header: "X-Variant"
    nginx.ingress.kubernetes.io/canary-by-header-value: "B"
spec:
  ingressClassName: nginx
  rules:
  - host: ab.aceest.local
    http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: aceest-b, port: { number: 80 } } } }] }
---
# Shadow: users are served by A; a copy of every request is mirrored to B and its response is discarded
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-shadow
  namespace: aceest
  annotations:
    nginx.ingress.kubernetes.io/mirror-target: "http://cluster.local"
    nginx.ingress.kubernetes.io/mirror-request-body: "on"
spec:
  ingressClassName: nginx
  rules:
  - host: shadow.aceest.local
    http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: aceest-a, port: { number: 80 } } } }] }
