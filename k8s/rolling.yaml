apiVersion: apps/v1
kind: Deployment
metadata: { name: aceest-rolling, namespace: aceest }
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector: { matchLabels: { app: aceest-rolling } }
  template:
    metadata: { labels: { app: aceest-rolling } }
    spec:
      containers:
      - name: app
        image: devkg1/aceest-fitness:V1
        env:
        - name: FLASK_HOST
          value: "0.0.0.0"
        ports: [{ containerPort: 5000 }]
        readinessProbe: { tcpSocket: { port: 5000 }, initialDelaySeconds: 5 }
        livenessProbe:  { tcpSocket: { port: 5000 }, initialDelaySeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: aceest-rolling, namespace: aceest }
spec:
  type: NodePort
  selector: { app: aceest-rolling }
  ports: [{ port: 80, targetPort: 5000, nodePort: 30080 }]
