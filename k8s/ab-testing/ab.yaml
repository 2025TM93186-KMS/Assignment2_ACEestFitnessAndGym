# Requires: minikube addons enable ingress
# Requests with header "X-Variant: B" get version B; everyone else gets version A.
apiVersion: apps/v1
kind: Deployment
metadata: { name: aceest-a }
spec:
  replicas: 2
  selector: { matchLabels: { app: aceest-ab, variant: a } }
  template:
    metadata: { labels: { app: aceest-ab, variant: a } }
    spec:
      containers: [{ name: aceest, image: "YOUR_DOCKERHUB_USER/aceest-fitness:1.0", ports: [{ containerPort: 5000 }] }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: aceest-b }
spec:
  replicas: 2
  selector: { matchLabels: { app: aceest-ab, variant: b } }
  template:
    metadata: { labels: { app: aceest-ab, variant: b } }
    spec:
      containers: [{ name: aceest, image: "YOUR_DOCKERHUB_USER/aceest-fitness:1.1", ports: [{ containerPort: 5000 }] }]
---
apiVersion: v1
kind: Service
metadata: { name: svc-a }
spec: { selector: { app: aceest-ab, variant: a }, ports: [{ port: 80, targetPort: 5000 }] }
---
apiVersion: v1
kind: Service
metadata: { name: svc-b }
spec: { selector: { app: aceest-ab, variant: b }, ports: [{ port: 80, targetPort: 5000 }] }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: ab-main }
spec:
  ingressClassName: nginx
  rules:
  - host: aceest.local
    http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: svc-a, port: { number: 80 } } } }] }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ab-variant-b
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-header: "X-Variant"
    nginx.ingress.kubernetes.io/canary-by-header-value: "B"
spec:
  ingressClassName: nginx
  rules:
  - host: aceest.local
    http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: svc-b, port: { number: 80 } } } }] }
