apiVersion: apps/v1
kind: Deployment
metadata: { name: aceest-green, labels: { app: aceest, slot: green } }
spec:
  replicas: 2
  selector: { matchLabels: { app: aceest, slot: green } }
  template:
    metadata: { labels: { app: aceest, slot: green } }
    spec:
      containers:
      - name: aceest
        image: YOUR_DOCKERHUB_USER/aceest-fitness:1.0
        ports: [{ containerPort: 5000 }]
        readinessProbe: { httpGet: { path: /api/health, port: 5000 }, periodSeconds: 5 }
