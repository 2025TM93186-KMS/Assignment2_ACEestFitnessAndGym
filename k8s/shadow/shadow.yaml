# Live version answers users; an nginx gateway mirrors every request to the shadow (new) version and discards its response.
apiVersion: apps/v1
kind: Deployment
metadata: { name: aceest-live }
spec:
  replicas: 2
  selector: { matchLabels: { app: aceest-shadow-demo, role: live } }
  template:
    metadata: { labels: { app: aceest-shadow-demo, role: live } }
    spec:
      containers:
      - name: aceest
        image: YOUR_DOCKERHUB_USER/aceest-fitness:1.0
        ports: [{ containerPort: 5000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: aceest-shadow }
spec:
  replicas: 1
  selector: { matchLabels: { app: aceest-shadow-demo, role: shadow } }
  template:
    metadata: { labels: { app: aceest-shadow-demo, role: shadow } }
    spec:
      containers:
      - name: aceest
        image: YOUR_DOCKERHUB_USER/aceest-fitness:1.1
        ports: [{ containerPort: 5000 }]
---
apiVersion: v1
kind: Service
metadata: { name: live-svc }
spec:
  selector: { app: aceest-shadow-demo, role: live }
  ports: [{ port: 80, targetPort: 5000 }]
---
apiVersion: v1
kind: Service
metadata: { name: shadow-svc }
spec:
  selector: { app: aceest-shadow-demo, role: shadow }
  ports: [{ port: 80, targetPort: 5000 }]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: shadow-nginx }
data:
  default.conf: |
    server {
      listen 80;
      location / {
        mirror /mirror;
        mirror_request_body on;
        proxy_pass http://live-svc;
      }
      location = /mirror {
        internal;
        proxy_pass http://shadow-svc$request_uri;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: shadow-gateway }
spec:
  replicas: 1
  selector: { matchLabels: { app: shadow-gateway } }
  template:
    metadata: { labels: { app: shadow-gateway } }
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports: [{ containerPort: 80 }]
        volumeMounts: [{ name: conf, mountPath: /etc/nginx/conf.d }]
      volumes: [{ name: conf, configMap: { name: shadow-nginx } }]
---
apiVersion: v1
kind: Service
metadata: { name: shadow-gateway }
spec:
  type: NodePort
  selector: { app: shadow-gateway }
  ports: [{ port: 80, targetPort: 80, nodePort: 30083 }]
