sonar.projectKey=aceest-fitness-and-gym
sonar.projectName=ACEest Fitness and Gym

# Scan the root directory for source and test files
sonar.sources=.
sonar.tests=.

# Exclude your virtual environment and cache files
sonar.exclusions=myenv/**,**/__pycache__/**

# Identify test files so SonarQube separates them from app.py
sonar.test.inclusions=test_*.py,**/test_*.py

# Optional: Uncomment if you generate a pytest coverage report in Jenkins
# sonar.python.coverage.reportPaths=coverage.xml

sonar.python.version=3
